<div class="cookie-modal" data-cookie-modal role="dialog" aria-modal="true" aria-labelledby="cookie-modal-title" hidden>
  <div class="cookie-modal__card">
    <h2 id="cookie-modal-title">{% t consent_modal_title %}</h2>
    <p>{% t consent_modal_text %} <a href="{% include privacy-url.html %}">{% t footer_privacy %}</a></p>
    <div class="cookie-modal__actions">
      <button type="button" class="button button--outline" data-consent-reject>{% t consent_reject %}</button>
      <button type="button" class="button button--primary" data-consent-accept>{% t consent_accept %}</button>
    </div>
  </div>
</div>
