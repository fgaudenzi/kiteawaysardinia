<section class="section section--reach" id="reach" aria-labelledby="reach-title">
  <div class="container reach-layout">
    <div>
      <p class="eyebrow">{% t nav_reach %}</p>
      <h2 id="reach-title">{% t reach_title %}</h2>
      <p>{% t reach_intro %}</p>

      <div class="reach-cards">
        <article class="reach-card">
          <h3>{% t reach_by_car_title %}</h3>
          <p>{% t reach_by_car_text %}</p>
        </article>
        <article class="reach-card">
          <h3>{% t reach_by_air_title %}</h3>
          <p>{% t reach_by_air_text %}</p>
        </article>
      </div>
    </div>

    <div class="reach-map">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5123.896026269608!2d8.414775577183642!3d39.10403133448341!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4a0cfd70d41f0ed7%3A0x151cb48db52506a4!2sKite%20Away%20Sardinia%20A.S.D.!5e1!3m2!1sit!2sde!4v1788454088642!5m2!1sit!2sde"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        title="Kite Away Sardinia location"
      ></iframe>
    </div>
  </div>
</section>
