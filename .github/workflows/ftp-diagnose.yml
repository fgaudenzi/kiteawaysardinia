name: FTP diagnose (una tantum)

on:
  push:
    branches:
      - ftp-diagnose

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raccogli informazioni
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p report
          base="ftp://${FTP_SERVER}/"
          u="${FTP_USERNAME}:${FTP_PASSWORD}"
          {
            for u in http://www.kiteawaysardinia.it/ https://www.kiteawaysardinia.it/ https://kiteawaysardinia.it/it/ https://kiteawaysardinia.it/privacy/ https://kiteawaysardinia.it/assets/css/main.css; do
              echo "== $u =="; curl -sSIL -m 20 "$u" | grep -iE '^(HTTP|location|content-type)' || true
              curl -sSL -m 20 "$u" -o /tmp/o.txt || true; head -c 200 /tmp/o.txt | tr '\n' ' '; echo
            done
          } > report/ftp-report.txt 2>&1
      - name: Salva il report su un ramo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ftp-report
          git add -f report/ftp-report.txt
          git commit -m "FTP report"
          git push -f origin ftp-report
