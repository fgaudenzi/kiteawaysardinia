spot_title: Cussorgia - vicino Punta Trettu, Sant'Antioco e Calasetta
spot_heading: "Cussorgia: scuola kitesurf in posizione strategica vicino Punta Trettu."
spot_text: Cussorgia è il luogo che abbiamo scelto per vivere, lavorare e costruire Kite Away Sardinia. La nostra scuola è vicina a Punta Trettu e facilmente raggiungibile da Sant'Antioco e Calasetta.
spot_intro_detail: Cussorgia si trova nel sud-ovest della Sardegna, tra Sant'Antioco e Calasetta, a pochi minuti dall'area kite di Punta Trettu. È una zona tranquilla, con ampi spazi e condizioni ideali per imparare e migliorare nel kitesurf.

spot_highlights_label: Perché scegliere Cussorgia
spot_highlight_1_title: Area dedicata al kitesurf
spot_highlight_1_text: La nostra area è dedicata al kitesurf e offre agli allievi spazio per esercitarsi con meno traffico e meno interferenze durante le lezioni.
spot_highlight_2_title: Acqua bassa e ampi spazi
spot_highlight_2_text: L'acqua bassa e gli ampi spazi aperti permettono di affrontare l'apprendimento in modo più progressivo, controllato e sicuro.
spot_highlight_3_title: Punta Trettu a una bordata
spot_highlight_3_text: La vicinanza a Punta Trettu è un vantaggio per i rider più esperti che vogliono esplorare altri spot della zona durante il soggiorno.
spot_highlight_4_title: A pochi minuti da Calasetta e Sant'Antioco
spot_highlight_4_text: Calasetta si raggiunge in circa 10 minuti in auto, mentre le spiagge e le calette di Sant'Antioco sono a circa 20 minuti.

spot_private_title: Un ambiente ideale per imparare
spot_private_text: La nostra area kite è dedicata al kitesurf e pensata per l'apprendimento. Meno affollamento significa più spazio per esercitarsi, seguire le indicazioni dell'istruttore e costruire progressivamente sicurezza e autonomia.

spot_wind_title: Vento e condizioni per il kitesurf
spot_wind_text: Cussorgia beneficia delle condizioni di vento tipiche della costa sud-occidentale della Sardegna e può offrire buone opportunità per lezioni e sessioni di kitesurf. L'orario delle lezioni viene concordato in base alle previsioni e alle condizioni reali, sempre dando priorità alla sicurezza e al livello dell'allievo.

spot_punta_title: Punta Trettu
spot_punta_text: Punta Trettu si trova nelle vicinanze ed è raggiungibile direttamente in kite dagli spot adatti alle condizioni del momento. Per i rider esperti è un'opzione interessante per esplorare una delle zone più conosciute per il kitesurf nel Sulcis.

spot_location_title: Tra Sant'Antioco e Calasetta
spot_location_text_1: La posizione di Cussorgia permette di raggiungere Calasetta e alcune delle sue spiagge più belle in circa 10 minuti in auto.
spot_location_text_2: Le spiagge e le calette di Sant'Antioco sono a circa 20 minuti, così puoi unire una giornata di kitesurf alla scoperta della costa del Sulcis.

spot_facilities_title: Tutto il necessario per una giornata di kitesurf
spot_facilities_text: "Dall'arrivo al post-session, abbiamo organizzato lo spazio per rendere la giornata semplice e piacevole: puoi cambiarti, preparare il kite, seguire la lezione, asciugare l'attrezzatura e poi goderti il resto della giornata in Sardegna."

spot_feature_1: Spogliatoio comodo
spot_feature_2: Area dedicata per asciugare mute e attrezzatura
spot_feature_3: Spazio per preparare e gestire l'attrezzatura
