spot_title: Cussorgia - Il nostro home spot
spot_heading: Per noi Cussorgia e molto piu di uno spot kite.
spot_text: E il luogo che abbiamo scelto per vivere, lavorare e costruire Kite Away Sardinia.
spot_intro_detail: Situata nel sud-ovest della Sardegna, tra Sant'Antioco e Calasetta, Cussorgia offre un lato piu tranquillo e meno affollato dell'isola.
spot_highlights_label: Vantaggi principali dello spot
spot_highlight_1_title: Area kite dedicata
spot_highlight_1_text: Zona interamente dedicata al kitesurf, senza altre scuole operative intorno a noi.
spot_highlight_2_title: Acqua bassa e spazio
spot_highlight_2_text: Acqua bassa e ampi spazi aperti rendono l'apprendimento piu progressivo e controllato.
spot_highlight_3_title: Punta Trettu a una bordata
spot_highlight_3_text: Un vantaggio interessante per rider esperti che vogliono esplorare altri spot.
spot_highlight_4_title: 10-20 min dalle spiagge migliori
spot_highlight_4_text: Calasetta a circa 10 minuti, spiagge e calette di Sant'Antioco a circa 20 minuti.
spot_private_title: Un luogo dedicato all'apprendimento
spot_private_text: La nostra area kite e totalmente dedicata al kitesurf. Senza altre scuole intorno, gli allievi hanno piu spazio, meno traffico e un ambiente piu calmo per progredire.
spot_wind_title: Condizioni del vento
spot_wind_text: Cussorgia beneficia dei venti termici sardi e puo offrire ottime condizioni per apprendimento e progressione, sempre con un approccio realistico e orientato alla sicurezza.
spot_punta_title: Punta Trettu
spot_punta_text: Punta Trettu e a una sola bordata, opzione ideale per rider esperti che vogliono esplorare la zona.
spot_location_title: Tra Sant'Antioco e Calasetta
spot_location_text_1: La nostra posizione permette di raggiungere Calasetta e alcune delle sue spiagge piu belle in circa 10 minuti in auto.
spot_location_text_2: Le spiagge e le calette di Sant'Antioco sono a circa 20 minuti, perfette per unire kitesurf ed esplorazione della costa del Sulcis.
spot_facilities_title: Servizi pensati per la giornata completa
spot_facilities_text: "Dall'arrivo al post-session, tutto e organizzato per rendere la giornata fluida: ti cambi con comodita, prepari il kite, fai lezione, asciughi l'attrezzatura e poi ti godi la Sardegna."
spot_feature_1: Spogliatoio comodo
spot_feature_2: Area dedicata per asciugatura mute e attrezzatura
spot_feature_3: Spazio per preparare e gestire l'attrezzatura kite
spot_feature_4: Doccia con acqua dolce
spot_feature_5: Area relax ombreggiata con tavoli e posti a sedere
spot_feature_6: Prese elettriche per ricaricare i dispositivi e asciugare i capelli
spot_highlight_1_image_alt: Placeholder immagine area kite dedicata
spot_highlight_2_image_alt: Placeholder immagine acqua bassa e spazio
spot_highlight_3_image_alt: Placeholder immagine collegamento a Punta Trettu
spot_highlight_4_image_alt: Placeholder immagine spiagge vicine e tempi di percorrenza
spot_facilities_image_alt: Placeholder immagine servizi giornata completa nello spot
spot_learning_image_alt: Placeholder immagine area apprendimento a Cussorgia
spot_wind_placeholder: "Punta Trettu offre venti costanti e ben incanalati, grazie alla particolare conformazione dello spot. Il Mistral è il vento dominante, affiancato da Scirocco, Levante e Ponente. La combinazione di vento regolare e acqua piatta crea condizioni ideali per imparare e migliorare."
spot_experience_lead: La parte migliore di Cussorgia e che la giornata non deve finire quando finisce la sessione.
spot_experience_text: Dopo la sessione kite puoi raggiungere facilmente spiagge, calette, borghi, ristoranti e punti panoramici intorno a Sant'Antioco e Calasetta.
spot_closing: Kite al mattino. Esplora l'isola nel pomeriggio. Torna per il tramonto.
