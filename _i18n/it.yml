lessons_title: Lezioni e corsi
lessons_heading: Corsi e lezioni di kitesurf a Cussorgia e Punta Trettu.
lessons_intro: Proponiamo lezioni private, lezioni semi-private e pacchetti corso per diversi livelli, dai primi passi fino all'autonomia. Siamo vicini a Sant'Antioco e Calasetta, in una posizione comoda per organizzare la tua vacanza kite in Sardegna.
