included_title: Cosa è incluso
included_text: Per le lezioni forniamo l'attrezzatura necessaria, inclusi tavola, kite, trapezio, casco, impact vest e sistemi di sicurezza. Sono inclusi anche il briefing dello spot e la pianificazione della lezione in base alle condizioni del vento e al livello dell'allievo.

