about_title: Chi siamo
about_hero_eyebrow: CHI SIAMO
about_hero_heading: Siamo Max & Hannah
about_hero_text_1: Kite Away Sardinia nasce dalla nostra passione per il kitesurf e dal desiderio di creare un'esperienza completa, non limitata alla singola lezione.
about_hero_text_2: Siamo partner nella vita e nel lavoro e abbiamo scelto il sud-ovest della Sardegna, e in particolare Cussorgia, per costruire qualcosa di nostro intorno al kitesurf, alla natura e all'ospitalità.
about_hero_image_alt: Max e Hannah di Kite Away Sardinia a Cussorgia
about_people_group_label: Profili di Max e Hannah
