about_hannah_image_alt: Hannah di Kite Away Sardinia

about_story_eyebrow: PERCHÉ ABBIAMO CREATO KITE AWAY
about_story_heading: "Una passione condivisa,\nun luogo da chiamare casa."
about_story_text_1: Siamo partner nella vita e nel lavoro e abbiamo scelto di costruire Kite Away Sardinia insieme.
about_story_text_2: "È più di una scuola di kitesurf: è un progetto nato dal nostro amore per questo sport, per la natura e per il sud-ovest della Sardegna."
about_story_text_3: Cussorgia non è solo il luogo in cui lavoriamo. È il posto che abbiamo scelto per vivere e costruire il nostro progetto.
about_story_image_alt: Cussorgia, il luogo scelto da Kite Away Sardinia

about_goal_eyebrow: IL NOSTRO OBIETTIVO È SEMPLICE
about_goal_heading: "Farti innamorare\ndel kitesurf -\ne farti venire voglia di tornare."
