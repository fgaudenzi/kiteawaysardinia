faq_title: FAQ
faq_heading: Tutto quello che devi sapere prima di una lezione di kitesurf.
faq_1_q: Posso imparare a fare kitesurf anche se sono principiante?
faq_1_a: "Certo. Non è richiesta esperienza precedente: le lezioni sono pensate anche per chi parte da zero. L'unico requisito è saper nuotare; grazie all'acqua bassa della laguna, puoi iniziare in un ambiente che permette di concentrarsi sulla tecnica e sulla sicurezza."
faq_2_q: Perché Cussorgia è un buon posto per imparare kitesurf?
faq_2_a: "Cussorgia offre diverse caratteristiche interessanti per chi vuole imparare: acqua piatta, fondale basso, ampi spazi e una zona generalmente meno affollata. Queste condizioni permettono di lavorare in modo progressivo sul controllo del kite e della tavola."
faq_3_q: Com'è l'acqua a Cussorgia? Si può stare in piedi?
faq_3_a: "Sì. In circa l'80% della laguna l'acqua è abbastanza bassa da permettere di toccare il fondo. La combinazione di acqua bassa e acqua piatta rende Cussorgia particolarmente adatta alle prime lezioni di kitesurf."
faq_4_q: Come funziona il vento e quando si fanno le lezioni di kitesurf?
faq_4_a: "La conformazione della laguna permette di lavorare con diverse condizioni di vento, in base alla direzione, all'intensità e al tipo di attività. Non seguiamo quindi orari rigidi: concordiamo l'orario della lezione in base alle previsioni e alle condizioni effettive dello spot."
faq_5_q: Cosa succede se il vento non è sufficiente per la lezione?
faq_5_a: "Se le condizioni non sono sufficienti per svolgere la lezione in sicurezza e con un buon risultato, preferiamo rimandarla al momento più adatto. Nel frattempo puoi scoprire la zona: Cussorgia si trova a pochi minuti da Calasetta e dalle spiagge di Sant'Antioco."
faq_6_q: Quanto tempo serve per imparare il kitesurf?
faq_6_a: "Ogni persona ha i propri tempi di apprendimento. In genere, con circa 6 ore di lezione si possono raggiungere le prime planate, ma il percorso varia da persona a persona. Alcuni imparano rapidamente a partire e hanno bisogno di più tempo per la bolina; altri seguono una progressione diversa. Per questo seguiamo i progressi individuali invece di promettere lo stesso risultato a tutti. Per arrivare a una buona autonomia, il percorso da 12 ore è quello che consigliamo più spesso."
faq_7_q: Cosa è incluso nelle lezioni di kitesurf e cosa devo portare?
faq_7_a: "Per la lezione forniamo l'attrezzatura necessaria, la muta e le scarpette. Ti consigliamo di portare semplicemente un poncho o un asciugamano e, se vuoi, qualcosa da bere."
faq_8_q: Quando posso considerarmi autonomo e noleggiare l'attrezzatura?
faq_8_a: "Quando avrai acquisito una buona autonomia nella gestione del kite e della tavola, saprai bolinare con sicurezza e sarai in grado di gestire le principali situazioni che possono presentarsi in acqua. Sarà l'istruttore a valutare il tuo livello e a indicarti quando sarai pronto per il noleggio."
faq_9_q: Dove posso alloggiare vicino alla scuola di kitesurf?
faq_9_a: "Puoi soggiornare comodamente a Sant'Antioco o a Calasetta, entrambe ottime basi per raggiungere Cussorgia e goderti la zona anche al di fuori delle ore di kitesurf. Al momento non abbiamo strutture convenzionate, ma stiamo lavorando per poter offrire presto anche questa possibilità."

reach_title: Come raggiungerci
reach_intro: Ci trovi a Cussorgia, vicino a Punta Trettu, tra Sant'Antioco e Calasetta. La scuola è raggiungibile comodamente in auto dall'aeroporto di Cagliari Elmas.
reach_by_car_title: In macchina
reach_by_car_text: Da Cagliari segui la SS130 verso Iglesias, poi prosegui in direzione Carbonia, Sant'Antioco e Calasetta. Le indicazioni finali ti portano verso Cussorgia e alla nostra area kite.
reach_by_air_title: In aereo
reach_by_air_text: "L'aeroporto di riferimento è Cagliari Elmas (CAG), collegato con i principali scali italiani ed europei. Dall'aeroporto puoi noleggiare un'auto: il tragitto fino a Cussorgia richiede circa 1 ora e 15 minuti, in base al traffico."

contact_title: Pronto a pianificare la tua sessione di kitesurf?
contact_text: Scrivici indicando date, livello ed eventuale numero di persone. Ti aiuteremo a scegliere il formato di lezione più adatto e a individuare la finestra di vento migliore.
