faq_title: FAQ
faq_heading: Da sapere prima di entrare in acqua.
faq_1_q: Posso imparare anche se non ho mai fatto kite?
faq_1_a: Certo! Il kitesurf è uno sport adatto a tutti e non è richiesta alcuna esperienza precedente. L'unico requisito è saper nuotare; grazie all'acqua bassa della laguna, per iniziare è sufficiente sentirsi a proprio agio in acqua e saper galleggiare.
faq_2_q: Perché Cussorgia è ideale per imparare?
faq_2_a: "Cussorgia offre condizioni particolarmente favorevoli a chi vuole imparare: acqua piatta, fondale basso e molto spazio per esercitarsi. Inoltre, il nostro lato della laguna è generalmente poco affollato, permettendoti di imparare con maggiore tranquillità e sicurezza."
faq_3_q: Com'è l'acqua? Si può stare in piedi?
faq_3_a: Sì. In circa l'80% della laguna l'acqua è abbastanza bassa da permettere di toccare il fondo. È proprio questa caratteristica, insieme all'acqua piatta, a rendere Cussorgia uno spot particolarmente adatto a chi è alle prime armi.
faq_4_q: Come funziona il vento e quando si fanno le lezioni?
faq_4_a: "La particolare conformazione della laguna ci permette di sfruttare diverse direzioni di vento e di svolgere le lezioni anche con vento più leggero, in base al tipo di attività e al livello dell'allievo. Per questo non seguiamo orari rigidi: concordiamo l'orario della lezione in base alle previsioni e alle condizioni effettive."
faq_5_q: Cosa succede se non c'è abbastanza vento?
faq_5_a: "Nessun problema: se le condizioni non sono sufficienti per svolgere la lezione in sicurezza e con un buon risultato, la rimandiamo al momento più adatto. Nel frattempo puoi approfittarne per scoprire la zona: siamo a pochi minuti da Calasetta e dalle sue spiagge, ideali per rilassarsi e godersi il panorama."
faq_6_q: Quanto tempo serve per imparare?
faq_6_a: "Ogni persona ha i propri tempi di apprendimento. In genere, con circa 6 ore di lezione si possono raggiungere le prime planate, ma il percorso può essere molto diverso da persona a persona: alcuni imparano rapidamente a partire e hanno bisogno di più tempo per imparare a bolinare, altri fanno il percorso opposto. Per questo preferiamo seguire i progressi individuali anziché promettere un risultato uguale per tutti. Per arrivare a una buona autonomia, il pacchetto da 12 ore è quello che consigliamo maggiormente."
faq_7_q: Cosa è incluso nelle lezioni e cosa devo portare?
faq_7_a: "Pensiamo noi a tutto il necessario per la lezione: attrezzatura completa, muta e scarpette sono inclusi. Ti consigliamo di portare semplicemente un poncho o un asciugamano e, se vuoi, qualcosa da bere."
faq_8_q: Quando posso considerarmi autonomo e noleggiare l'attrezzatura?
faq_8_a: Quando avrai acquisito una buona autonomia nella gestione del kite e della tavola, saprai bolinare con sicurezza e sarai in grado di gestire autonomamente le principali situazioni che possono presentarsi in acqua. Sarà l'istruttore, valutando il tuo livello, a indicarti quando sarai pronto per il noleggio.
faq_9_q: Dove posso alloggiare e come raggiungo la scuola?
faq_9_a: Puoi soggiornare comodamente a Sant'Antioco o a Calasetta, entrambe ottime basi per raggiungere la scuola e godersi la zona anche al di fuori delle ore di kite. Al momento non abbiamo ancora strutture convenzionate, ma stiamo lavorando per poter offrire presto anche questa possibilità.
reach_title: Come raggiungerci
reach_intro: Ci trovi a Cussorgia, nel sud-ovest della Sardegna, in una posizione comoda da raggiungere sia in auto che in aereo.
reach_by_car_title: In macchina
reach_by_car_text: Da Cagliari segui la SS130 verso Iglesias, poi prosegui in direzione Carbonia, Sant'Antioco e Calasetta. Le indicazioni finali ti portano alla laguna di Cussorgia, dove si trova il nostro spot.
reach_by_air_title: In aereo
reach_by_air_text: "L'aeroporto di riferimento e Cagliari Elmas (CAG), collegato con i principali scali italiani ed europei. Dall'aeroporto puoi noleggiare un'auto: il tragitto fino a Cussorgia richiede circa 1 ora e 15 minuti, in base al traffico."
contact_title: Pronto a pianificare la tua sessione?
contact_text: Scrivici date, livello e numero di persone. Ti suggeriremo il formato migliore e la finestra di vento più adatta.
