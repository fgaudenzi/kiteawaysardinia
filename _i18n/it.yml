spot_wind_placeholder: "Le condizioni del vento nella zona dipendono dalla direzione e dall'intensità delle condizioni meteo del momento. Mistral, Scirocco, Levante e Ponente possono influenzare diversi spot del Sulcis in modo differente. Per questo organizziamo le lezioni in base alle previsioni e alle condizioni effettive, scegliendo il momento più adatto al livello e all'attività prevista."

spot_experience_lead: La giornata non deve finire quando finisce la sessione.
spot_experience_text: Dopo una sessione di kitesurf puoi raggiungere facilmente spiagge, calette, borghi, ristoranti e punti panoramici tra Sant'Antioco e Calasetta, e continuare a scoprire il sud-ovest della Sardegna.
spot_closing: Kite al mattino. Esplora il Sulcis nel pomeriggio. Torna per il tramonto.

