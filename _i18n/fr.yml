about_title: À propos
about_hero_eyebrow: A PROPOS
about_hero_heading: Nous sommes Max & Hannah
about_hero_text_1: Kite Away Sardinia est ne de notre passion pour le kitesurf et de l'envie d'en faire une experience complete, pas seulement un cours.
about_hero_text_2: Nous sommes partenaires dans la vie et au travail, et nous avons choisi le sud-ouest de la Sardaigne pour construire notre propre projet.
about_hero_image_alt: Image placeholder de Max et Hannah ensemble
about_people_group_label: Profils de Max et Hannah
