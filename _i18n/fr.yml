about_story_eyebrow: POURQUOI NOUS AVONS CREE KITE AWAY
about_story_heading: "Une passion partagee,\nun lieu a appeler maison."
about_story_text_1: Nous sommes partenaires dans la vie et au travail, et nous avons choisi de construire Kite Away Sardinia ensemble.
about_story_text_2: C'est plus qu'une ecole - c'est un projet ne de notre amour du kitesurf, de la nature et de cette ile incroyable.
about_story_text_3: Cussorgia n'est pas seulement notre lieu de travail. C'est le lieu que nous avons choisi pour vivre et construire notre projet.
about_story_image_alt: Image placeholder pour l'histoire du projet Kite Away
about_goal_eyebrow: NOTRE OBJECTIF EST SIMPLE
about_goal_heading: "Vous faire tomber amoureux\ndu kitesurf -\net vous donner envie de revenir."
about_goal_text_1: Nous ne promettons pas de rendre un sport exigeant facile.
about_goal_text_2: Nous promettons de l'enseigner avec attention, competence et passion, dans l'un des lieux que nous avons choisis comme maison.
