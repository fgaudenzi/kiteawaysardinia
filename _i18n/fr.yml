spot_title: Cussorgia - Notre home spot
spot_heading: Pour nous, Cussorgia est bien plus qu'un spot de kite.
spot_text: C'est le lieu que nous avons choisi pour vivre, travailler et construire Kite Away Sardinia.
spot_intro_detail: Situee dans le sud-ouest de la Sardaigne, entre Sant'Antioco et Calasetta, Cussorgia offre une partie plus calme et moins frequentee de l'ile.
spot_highlights_label: Points forts du spot
spot_highlight_1_title: Zone kite dediee
spot_highlight_1_text: Zone entierement dediee au kitesurf, sans autres ecoles operant autour de nous.
spot_highlight_2_title: Eau peu profonde et espace
spot_highlight_2_text: Eau peu profonde et grands espaces ouverts pour apprendre dans un cadre controle.
spot_highlight_3_title: Punta Trettu a un seul bord
spot_highlight_3_text: Un vrai plus pour les riders confirmes qui veulent explorer la zone.
spot_highlight_4_title: 10-20 min des plus belles plages
spot_highlight_4_text: Calasetta a environ 10 minutes, plages et criques de Sant'Antioco a environ 20 minutes.
spot_private_title: Un lieu dedie a l'apprentissage
spot_private_text: Notre aire kite est entierement dediee au kitesurf. Sans autres ecoles autour, les eleves profitent de plus d'espace, de moins de trafic et d'un environnement plus serein.
spot_wind_title: Conditions de vent
spot_wind_text: Cussorgia profite des vents thermiques sardes et peut offrir d'excellentes conditions pour apprendre et progresser, avec une lecture realiste des conditions du jour.
spot_punta_title: Punta Trettu
spot_punta_text: Punta Trettu est a un seul bord, ideal pour les riders experimentes qui veulent explorer d'autres zones.
spot_location_title: Entre Sant'Antioco et Calasetta
spot_location_text_1: Notre position permet de rejoindre Calasetta et certaines de ses plus belles plages en environ 10 minutes en voiture.
spot_location_text_2: Les plages et criques de Sant'Antioco sont a environ 20 minutes, parfait pour combiner kitesurf et decouverte du littoral du Sulcis.
spot_facilities_title: Services au service de la journee complete
spot_facilities_text: "De l'arrivee a l'apres-session, tout est pense pour la fluidite: vous vous changez confortablement, preparez le kite, suivez le cours, faites secher le materiel, puis profitez de la Sardaigne."
spot_feature_1: Vestiaire confortable
spot_feature_2: Zone dediee de sechage combinaisons et materiel
spot_feature_3: Espace pour preparer et gerer le materiel kite
spot_feature_4: Douche d'eau douce
spot_feature_5: Espace detente ombrage avec tables et assises
spot_feature_6: Prises electriques pour recharger vos appareils et secher vos cheveux
spot_highlight_1_image_alt: Placeholder image zone kite dediee
spot_highlight_2_image_alt: Placeholder image eau peu profonde et espace
spot_highlight_3_image_alt: Placeholder image acces Punta Trettu
spot_highlight_4_image_alt: Placeholder image plages proches et temps de trajet
spot_facilities_image_alt: Placeholder image services pour la journee complete
spot_learning_image_alt: Placeholder image zone apprentissage a Cussorgia
spot_wind_placeholder: "Punta Trettu bénéficie de vents réguliers et bien canalisés grâce à la configuration unique du spot. Le Mistral est le vent dominant, accompagné du Scirocco, du Levante et du Ponente. Associés à une eau parfaitement plate, ces vents offrent des conditions idéales pour apprendre et progresser."
spot_experience_lead: Le meilleur de Cussorgia, c'est que la journee ne doit pas finir quand la session se termine.
spot_experience_text: Apres la session, vous pouvez rejoindre facilement plages, criques, villages, restaurants et points de vue autour de Sant'Antioco et Calasetta.
spot_closing: Kite le matin. Explorez l'ile l'apres-midi. Revenez pour le coucher du soleil.
