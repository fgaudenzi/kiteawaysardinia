spot_title: Cussorgia - Punta Trettu
spot_heading: Cussorgia is more than a kite spot for us.
spot_text: It is the place we chose to live, work, and build Kite Away Sardinia.
spot_intro_detail: Located in south-western Sardinia between Sant'Antioco and Calasetta, Cussorgia offers a quieter and less crowded side of the island and it is just a cross wind ride to the famous Punta Trettu.
spot_highlights_label: Spot highlights
spot_highlight_1_title: Dedicated kite area
spot_highlight_1_text: A fully dedicated kite zone with no other kite schools operating around us.
spot_highlight_2_title: Shallow water & space
spot_highlight_2_text: Shallow water and wide open areas make learning smoother and progression more controlled.
spot_highlight_3_title: Punta Trettu — one tack away
spot_highlight_3_text: Experienced riders can quickly connect to one of the most famous kite areas nearby.
spot_highlight_4_title: 10–20 min from top beaches
spot_highlight_4_text: Calasetta in about 10 minutes, Sant'Antioco beaches and coves in about 20 minutes.
spot_private_title: A dedicated place to learn
spot_private_text: Our kite area is entirely dedicated to kitesurfing. With no other kite schools around, students have more space, less traffic, and a calmer environment to progress.
spot_wind_title: Wind conditions
spot_wind_text: Cussorgia benefits from Sardinian thermal winds and can deliver excellent conditions for learning and skill progression, always interpreted with a realistic daily safety approach.
spot_punta_title: Punta Trettu
spot_punta_text: Punta Trettu is only one tack away, an ideal option for experienced riders who want to explore more of the area.
spot_location_title: Between Sant'Antioco and Calasetta
spot_location_text_1: Our position lets you reach Calasetta and some of its most beautiful beaches in around 10 minutes by car.
spot_location_text_2: Sant'Antioco beaches and coves are around 20 minutes away, perfect for combining kitesurfing with coastline exploration in Sulcis.
spot_facilities_title: Facilities that support the full day
spot_facilities_text: "From arrival to post-session, everything is set to keep your day smooth: get changed comfortably, prepare your kite, ride, dry your equipment, and then enjoy Sardinia."
spot_feature_1: Comfortable changing room
spot_feature_2: Dedicated wetsuit and gear washing and drying area
spot_feature_3: Wide and safe space to prepare and pack kite equipment
spot_feature_4: Fresh-water shower
spot_feature_5: Shaded chill area with tables and seating
spot_feature_6: Power outlets to charge your devices and dry your hair
spot_highlight_1_image_alt: Placeholder image for dedicated kite area
spot_highlight_2_image_alt: Placeholder image for shallow water and space
spot_highlight_3_image_alt: Placeholder image for Punta Trettu access
spot_highlight_4_image_alt: Placeholder image for nearby beaches and travel times
spot_facilities_image_alt: Placeholder image for full-day facilities at the spot
spot_learning_image_alt: Placeholder image for learning-focused area in Cussorgia
spot_wind_placeholder: "Punta Trettu offers consistent, well-established winds thanks to the unique shape of the spot. Mistral is the dominant wind, joined by Scirocco, Levante and Ponente. Combined with flat water, these reliable conditions make Punta Trettu ideal for learning and progressing."
spot_experience_lead: The best part of Cussorgia is that the day does not have to end when the session does.
spot_experience_text: After or before your kite session, you can easily reach beaches, coves, small villages, restaurants, and viewpoints around Sant'Antioco and Calasetta.
spot_closing: Do your kite Lesson or Ride and combine exploring the island. Come back for sunset.
