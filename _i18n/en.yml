spot_title: Private spot
spot_heading: Everything you need, right at our spot.
spot_text: At Kite Away, we built a large and comfortable base designed to make your day on the water simple, safe, and enjoyable.
spot_private_title: A spot built around kiters
spot_private_text: Our spot is one of the largest in the area, with a dedicated kite zone for our school and riders. No other kite schools operate around us, so you get more space, less pressure, and smoother sessions.
spot_feature_1: Private parking
spot_feature_2: Comfortable changing room before and after your session
spot_feature_3: Outdoor shower
spot_feature_4: Wetsuit and gear drying area
spot_feature_5: Shaded chill area
spot_feature_6: Dedicated safe launch and landing area
spot_feature_7: Large grass area for comfortable rigging and packing
spot_feature_8: Electricity for charging devices and post-session convenience
spot_location_title: Strategic location between Calasetta and Sant Antioco
spot_location_text_1: We are positioned between Calasetta and Sant Antioco, with some of the most beautiful beaches in the area only 5 minutes away by car.
spot_location_text_2: Before or after your lesson, you can enjoy a beach break, a swim, or more riding. Punta Trettu is only one tack away.
spot_quality_title: Pro equipment and certified instructors
spot_quality_text: We use Ventum Kiteboarding gear and IKO certified instructors, following internationally recognized teaching and safety standards.
spot_quality_point_1: Clear progression paths for first-timers and advancing riders
spot_quality_point_2: Spot setup designed to maximize real time on the water
