spot_title: Cussorgia - Unser Home Spot
spot_heading: Fur uns ist Cussorgia mehr als nur ein Kite Spot.
spot_text: Es ist der Ort, den wir gewahlt haben, um zu leben, zu arbeiten und Kite Away Sardinia aufzubauen.
spot_intro_detail: Cussorgia liegt im Sudwesten Sardiniens zwischen Sant'Antioco und Calasetta, in einem ruhigeren und weniger uberlaufenen Teil der Insel.
spot_highlights_label: Spot Highlights
spot_highlight_1_title: Dedizierter Kitebereich
spot_highlight_1_text: Vollstandig dem Kitesurfen gewidmeter Bereich, ohne andere Kiteschulen direkt um uns herum.
spot_highlight_2_title: Flaches Wasser und viel Platz
spot_highlight_2_text: Flaches Wasser und grosse offene Flachen sind ideal fur Einsteiger und kontrollierte Progression.
spot_highlight_3_title: Punta Trettu nur ein Schlag entfernt
spot_highlight_3_text: Besonders interessant fur erfahrene Rider, die weitere Spots erkunden mochten.
spot_highlight_4_title: 10-20 Min zu Top Stranden
spot_highlight_4_text: Calasetta in etwa 10 Minuten, Strande und Buchten von Sant'Antioco in etwa 20 Minuten.
spot_private_title: Ein Ort, der aufs Lernen ausgelegt ist
spot_private_text: Unser Kitebereich ist komplett dem Kitesurfen gewidmet. Ohne andere Schulen in der Nahe haben Schuler mehr Platz, weniger Verkehr und eine ruhigere Lernumgebung.
spot_wind_title: Windbedingungen
spot_wind_text: Cussorgia profitiert von sardischen Thermikwinden und kann hervorragende Bedingungen fur Lernen und Progression bieten, immer mit realistischer Tagesbewertung und Sicherheitsfokus.
spot_punta_title: Punta Trettu
spot_punta_text: Punta Trettu ist nur einen Schlag entfernt, ideal fur erfahrene Rider, die die Region weiter entdecken wollen.
spot_location_title: Zwischen Sant'Antioco und Calasetta
spot_location_text_1: Von unserem Standort erreichst du Calasetta und einige seiner schonsten Strande in rund 10 Minuten mit dem Auto.
spot_location_text_2: Die Strande und Buchten von Sant'Antioco liegen bei rund 20 Minuten und machen die Sulcis Kuste perfekt fur Kite plus Entdeckung.
spot_facilities_title: Infrastruktur fur den ganzen Tag
spot_facilities_text: "Von der Ankunft bis nach der Session ist alles auf einen einfachen Ablauf ausgelegt: bequem umziehen, Material vorbereiten, Session fahren, Ausrustung trocknen, dann Sardinien geniessen."
spot_feature_1: Komfortabler Umkleideraum
spot_feature_2: Dedizierter Bereich zum Trocknen von Neopren und Ausrustung
spot_feature_3: Platz zum Vorbereiten und Organisieren der Kite Ausrustung
spot_feature_4: Susswasserdusche
spot_feature_5: Schattiger Chill-Bereich mit Tischen und Sitzplaetzen
spot_feature_6: Stromanschluesse zum Laden deiner Gerate und Fohnen deiner Haare
spot_highlight_1_image_alt: Placeholder Bild dedizierter Kitebereich
spot_highlight_2_image_alt: Placeholder Bild flaches Wasser und viel Platz
spot_highlight_3_image_alt: Placeholder Bild Zugang zu Punta Trettu
spot_highlight_4_image_alt: Placeholder Bild nahe Strande und Fahrzeiten
spot_facilities_image_alt: Placeholder Bild Infrastruktur fur den ganzen Tag
spot_learning_image_alt: Placeholder Bild Lernbereich in Cussorgia
spot_wind_placeholder: "Punta Trettu bietet dank der besonderen Lage des Spots konstante und gut kanalisierte Winde. Der Mistral ist der vorherrschende Wind, ergänzt durch Scirocco, Levante und Ponente. Zusammen mit dem flachen Wasser entstehen ideale Bedingungen zum Lernen und Weiterentwickeln."
spot_experience_lead: Das Beste an Cussorgia ist, dass der Tag nicht enden muss, wenn die Session vorbei ist.
spot_experience_text: Nach der Session erreichst du schnell Strande, Buchten, kleine Orte, Restaurants und Aussichtspunkte rund um Sant'Antioco und Calasetta.
spot_closing: Kiten am Morgen. Insel entdecken am Nachmittag. Zuruck zum Sunset.
