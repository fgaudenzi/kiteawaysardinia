spot_title: Privater Spot
spot_heading: Alles, was du brauchst, direkt an unserem Spot.
spot_text: Bei Kite Away haben wir eine grosse und komfortable Base aufgebaut, damit dein Tag auf dem Wasser einfach, sicher und angenehm wird.
spot_private_title: Ein Spot speziell fur Kiter
spot_private_text: "Unser Spot ist einer der groessten in der Region, mit einem eigenen Kitebereich nur fur unsere Schule und Rider. Keine andere Kiteschule arbeitet direkt um uns herum: mehr Platz, weniger Druck, bessere Sessions."
spot_feature_1: Privater Parkplatz
spot_feature_2: Komfortabler Umkleideraum vor und nach der Session
spot_feature_3: Aussendusche
spot_feature_4: Bereich zum Trocknen von Neopren und Material
spot_feature_5: Schattiger Chill Bereich
spot_feature_6: Eigener Bereich fur sicheres Starten und Landen
spot_feature_7: Grosse Wiesenflaeche zum Aufbauen und Verstauen der Kites
spot_feature_8: Strom zum Laden von Geraeten und fur mehr Komfort nach der Session
spot_location_title: Strategische Lage zwischen Calasetta und Sant Antioco
spot_location_text_1: Wir liegen zwischen Calasetta und Sant Antioco, mit einigen der schoensten Straende der Gegend nur 5 Minuten mit dem Auto entfernt.
spot_location_text_2: Vor oder nach dem Kurs kannst du den Strand geniessen, baden oder weiterfahren. Punta Trettu ist nur einen Schlag entfernt.
spot_quality_title: Profi Material und zertifizierte Instruktoren
spot_quality_text: Wir nutzen Ventum Kiteboarding Ausruestung und IKO zertifizierte Instruktoren nach international anerkannten Lehr und Sicherheitsstandards.
spot_quality_point_1: Klare Lernpfade fur Einsteiger und Rider in Progression
spot_quality_point_2: Spot Setup mit Fokus auf maximale echte Wasserzeit
